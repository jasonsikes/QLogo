name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.build-type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build-type: [Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get upgrade -y
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          qt6-base-dev \
          qt6-svg-dev \
          llvm-21-dev
        
    - name: Configure CMake
      run: |
        cmake -S . -B build
              
    - name: Build
      run: |
        cd build
        make -j$(nproc || sysctl -n hw.ncpu)
        
    - name: Test
      run: |
        cd build/tests/console
        ./test.sh



