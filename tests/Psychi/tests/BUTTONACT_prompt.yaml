name: BUTTONACT at the prompt
description: A mouse click at the ? prompt runs BUTTONACT without consuming BUTTON

messages:
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "

  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: 'make "buttonact [print [clicked]]'

  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "

  - send:
      message: C_CANVAS_MOUSE_BUTTON_DOWN
      data:
        - {x: 10.0, y: 20.0}
        - 1

  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "clicked"

  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "print button"

  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "1"

  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "

  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "BYE"

  - expect:
      message: C_CONSOLE_PRINT_STRING

  - expect:
      message: W_CLOSE_PIPE

  - close_write_pipe: {}
