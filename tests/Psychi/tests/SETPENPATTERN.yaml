name: SETPENPATTERN Test
description: Tests unordered SETPENPATTERN words, partial updates, and custom dashes

messages:
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "show penpattern"
  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "[solidline squarecap beveljoin]\n"
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "setpenpattern [roundcap]"
  - expect:
      message: C_CANVAS_SET_PENPATTERN
      data:
        style: 1
        cap: 32
        join: 64
        dash: []
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "show penpattern"
  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "[solidline roundcap beveljoin]\n"
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "setpenpattern [beveljoin dashline]"
  - expect:
      message: C_CANVAS_SET_PENPATTERN
      data:
        style: 2
        cap: 32
        join: 64
        dash: []
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "setpenpattern [[4 2]]"
  - expect:
      message: C_CANVAS_SET_PENPATTERN
      data:
        style: 6
        cap: 32
        join: 64
        dash: [4.0, 2.0]
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "show penpattern"
  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "[[4 2] roundcap beveljoin]\n"
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "setpenpattern [[4 2 1]]"
  - expect:
      message: C_CANVAS_SET_PENPATTERN
      data:
        style: 6
        cap: 32
        join: 64
        dash: [4.0, 2.0, 1.0]
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "show penpattern"
  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "[[4 2 1] roundcap beveljoin]\n"
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "
  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "bye"
  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "\n"
  - expect:
      message: W_CLOSE_PIPE
      data: null
  - close_write_pipe: {}
