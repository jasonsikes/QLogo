name: KEYACT during WAIT
description: A character during WAIT runs KEYACT, which can READCHAR that character

messages:
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "

  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: 'make "keyact [print rc throw "toplevel] forever [wait 6000]'

  - expect:
      message: W_TIMER_START

  - send:
      message: C_CONSOLE_KEY_EVENT
      data: "x"

  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "x"
      timeout: 2.0

  - expect:
      message: C_CONSOLE_PRINT_STRING

  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "

  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "BYE"

  - expect:
      message: C_CONSOLE_PRINT_STRING

  - expect:
      message: W_CLOSE_PIPE

  - close_write_pipe: {}
