name: BUTTONACT during WAIT
description: A mouse click during WAIT runs BUTTONACT and returns from WAIT early

messages:
  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "

  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: 'make "buttonact [print [clicked] throw "toplevel] forever [wait 6000]'

  - expect:
      message: W_TIMER_START

  - send:
      message: C_CANVAS_MOUSE_BUTTON_DOWN
      data:
        - {x: 0.0, y: 0.0}
        - 1

  - expect:
      message: C_CONSOLE_PRINT_STRING
      data: "clicked"
      timeout: 2.0

  - expect:
      message: C_CONSOLE_PRINT_STRING

  - expect:
      message: C_CONSOLE_REQUEST_LINE
      data:
        prompt: "? "

  - send:
      message: C_CONSOLE_RAWLINE_READ
      data: "BYE"

  - expect:
      message: C_CONSOLE_PRINT_STRING

  - expect:
      message: W_CLOSE_PIPE

  - close_write_pipe: {}
